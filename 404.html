<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Deven Bhalerao</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17141f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf7f5" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=3">
<script>
  // Same theme and animation preferences as the front page
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    var motion = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
      var saved = localStorage.getItem('motion');
      if (saved === 'on') motion = true;
      if (saved === 'off') motion = false;
    } catch (e) {}
    if (motion) root.classList.add('motion-on');
  })();
</script>
</head>
<body>
<main id="main">
  <section class="notfound">
    <p class="notfound-code">Error 404</p>
    <h1>This page<br>doesn't exist.</h1>
    <p class="lede">The link is broken or the page has moved. Everything worth reading is on the front page.</p>
    <a class="btn btn-primary" href="/">
      Back to the start
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <p class="footer-copy">© <span id="year">2026</span> Deven Bhalerao</p>
    <p>devenbhalerao.com</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
